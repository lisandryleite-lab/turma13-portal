["O APFDM é ato complexo: não se aperfeiçoa por um único ato, mas por um conjunto sequencial que se inicia com a voz de prisão e se encerra com a entrega da Nota de Culpa.",true,"Correto, conforme o conceito do APFDM na apostila."],

["A Autoridade Originária Mitigada pode instaurar APFDM, IPM e IPD, desde que o faça dentro da sua unidade.",false,"Falso. A competência da Mitigada é limitada à lavratura do APFDM; não instaura IPM nem IPD."],

dc:[
["Explique o que é a Autoridade de Polícia Judiciária Militar Originária Mitigada e indique as duas razões pelas quais sua competência é mitigada. Compare com as autoridades Plena e Delegada.","6 a 15 linhas","A Autoridade Originária Mitigada é o pequeno rol de militares (Oficial de Dia, de Serviço ou de Quarto e autoridade correspondente) que, mesmo sem exercer o papel de Comandante, possuem por definição legal competência para instaurar procedimento de PJM, limitada ao APFDM (art. 245, CPPM).\nA competência é mitigada por duas razões: (1) limita-se à abertura do APFDM, não cabendo IPM ou IPD; (2) não cabe delegação.\nComparação: a Originária Plena (Comandantes em geral) pode instaurar APFDM, IPM e IPD e pode delegar; a Delegada é o oficial da ativa designado por autoridade superior (art. 7º, §1º, CPPM), com atribuição específica por tempo limitado."],
["Descreva as duas etapas da primeira atribuição cognitiva do Oficial de Serviço diante de possível flagrante e o tratamento da apresentação espontânea do imputado.","6 a 15 linhas","Etapa 1: verificar se o fato é crime militar (art. 9º do CPM). Etapa 2: verificar se é flagrante, enquadrando-se em uma das hipóteses do art. 244 do CPPM. Somente se ambas forem positivas procede-se à lavratura do APFDM.\nSe o imputado se apresentar espontaneamente (sem condução coercitiva), não se lavra APFDM; toma-se o termo de declarações previsto no art. 262 do CPPM, assinado por duas testemunhas."],
["Enumere as modalidades de flagrante previstas no art. 244 do CPPM e comente o art. 243 e a natureza do flagrante (ato complexo e fases).","10 a 20 linhas","Art. 244: considera-se em flagrante quem (a) está cometendo o crime; (b) acaba de cometê-lo (flagrante próprio); (c) é perseguido logo após em situação que faça acreditar ser o autor (impróprio ou quase flagrante); (d) é encontrado logo depois com instrumentos, objetos, material ou papéis que façam presumir sua participação (presumido ou ficto). Nas infrações permanentes, há flagrante enquanto não cessar a permanência.\nArt. 243: qualquer pessoa poderá e os militares deverão prender quem seja encontrado em flagrante, inclusive superior.\nO flagrante é ato complexo: não se completa por um só ato. Apresenta-se em duas fases, iniciando-se na voz de prisão do condutor (captura) e encerrando-se na expedição da Nota de Culpa. Fundamento constitucional: art. 5º, LXI, CF."]

dc:[
["Explique a natureza e a função da Portaria de instauração do APFDM, a designação do escrivão e os atos de Recebimento e Certidão.","6 a 15 linhas","A Portaria é o documento inaugural do APFDM; a partir dela o Presidente dá as primeiras ordens ao escrivão. A instauração é de ofício, originária do Oficial de Serviço, e preferencialmente se adotam as regras de competência do IPM (Capitão).\nO escrivão é designado já na Portaria (art. 245, §4º: se o indiciado for oficial, capitão, capitão-tenente, 1º ou 2º tenente; nos demais casos, subtenente, suboficial ou sargento) e deve prestar o compromisso legal, em termo assinado pelo Presidente e pelo escrivão. Na falta ou impedimento, designa-se pessoa idônea (§5º, escrivão ad hoc).\nAs ordens emanadas na Portaria devem ser recepcionadas nos autos (Recebimento) e certificadas ao serem cumpridas (Certidão)."],
["Descreva a coleta dos depoimentos (Auto propriamente dito): forma, ordem, assinaturas e hipóteses de ausência de testemunhas ou recusa/analfabetismo.","6 a 15 linhas","O Auto propriamente dito é o principal documento do APFDM e, ao contrário do APFD, é feito em texto corrido. Ordem: condutor, testemunhas, ofendido e, por último, o imputado. A primeira folha é rubricada por todos e a última é assinada por todos.\nA falta de testemunhas não impede o APFDM, que será assinado por pelo menos duas pessoas que tenham presenciado a apresentação do preso (art. 245, §2º). Se alguém não quiser assinar ou for analfabeto, o auto será assinado por duas testemunhas que lhe tenham ouvido a leitura na presença do indiciado, do condutor e das testemunhas do fato (§3º)."],
["Indique as providências imprescindíveis após a lavratura do APFDM e a distribuição das vias para a Audiência de Custódia, citando o fundamento do relaxamento da prisão (art. 247, §2º, CPPM).","10 a 20 linhas","Após a lavratura, juntam-se aos autos originais: (1) ofício de informação à família (ou pessoa indicada), devidamente recibado; (2) Nota de Culpa original, recibada pelo preso; (3) cópia do ofício de apresentação do preso ao IML, com recibo do médico.\nO preso é conduzido à Audiência de Custódia. Emite-se uma via do APFDM, xerocopiada em 3 vias: Juiz, Promotor e Defensor da Audiência de Custódia, ficando cópia na Central de Inquéritos. Outras vias podem ser enviadas por razões administrativas (Cmt da Unidade, 2ª EMG, Cmt-Geral), inclusive por e-mail.\nRelaxamento: se a autoridade verificar a manifesta inexistência de infração penal militar ou a não participação da pessoa conduzida, relaxará a prisão; tratando-se de infração comum, remeterá o preso à autoridade civil competente (art. 247, §2º)."]

dc:[
["Discorra sobre a Nota de Culpa no APFDM: relevância, prazo, elementos estruturantes, recibo e procedimento diante da recusa do preso em assinar.","10 a 20 linhas","A Nota de Culpa é o documento que dá ciência oficial ao preso das razões de sua prisão, tendo fundamental importância, e integra a garantia constitucional (art. 5º, LXIV, CF).\nPrazo: dentro de 24 horas após a prisão (art. 247, CPPM). O descumprimento do prazo é irregularidade que compromete a regularidade da prisão.\nElementos: motivo da prisão, nome do condutor e nomes das testemunhas, assinada pela autoridade. A ausência desses elementos compromete a finalidade do ato.\nRecibo: o preso passa recibo; se não souber, não puder ou não quiser assinar, o recibo é assinado por duas testemunhas (§1º), com registro formal da recusa. A Nota de Culpa original recibada é juntada aos autos."],
["Aponte, no mínimo, três diferenças entre o APFDM e o APFD.","6 a 15 linhas","(1) Liberdade provisória: no APFDM não cabe, com ou sem fiança; no APFD cabe, com fiança fixada pelo Delegado para crimes com pena máxima até 4 anos. (2) TCO: não há nos crimes militares (art. 90-A, Lei 9.099/95); no APFD cabe. (3) Forma: no APFDM os depoimentos são em texto corrido, com assinatura conjunta; no APFD, após a reforma, são individualizados. (4) O APFDM pode dispensar o IPM (art. 27, CPPM); o APFD dá início a inquérito policial. Em ambos o relaxamento pelo encarregado é possível, embora a expressão seja discutível no APFDM."],
["Explique a Audiência de Custódia no contexto do APFDM e relacione as prisões cautelares previstas no CPPM, indicando as não previstas.","10 a 20 linhas","A Audiência de Custódia é instituto inspirado no art. 7º, V, do Pacto de San José da Costa Rica e no Pacto Internacional sobre Direitos Civis e Políticos, praticado desde 2016 a partir da Resolução 213/2015 do CNJ. Após a lavratura, o preso é conduzido a ela; o exaurimento do flagrante só ocorre depois dela. Antes, o militar preso era apresentado ao Diretor do Presídio Militar; hoje inexiste ordem direta do encarregado ao Diretor.\nPrisões cautelares do CPPM: flagrante (autoridade de PJM, até a audiência de custódia, art. 244), preventiva (Juiz, art. 255), prisão do Encarregado do IPM (30 dias, prorrogáveis por 30), prisão do desertor (60 dias) e menagem (Juiz, art. 263). Não previstas no CPPM: prisão temporária e prisão por pronúncia."]

dc:[
["Explique por que a Instrução Provisória de Deserção (IPD) é classificada como um “procedimento misto” e cite quais são os órgãos envolvidos em sua conclusão.","6 a 15 linhas","A IPD é procedimento misto e preliminar à ação penal porque seus atos se distribuem entre dois âmbitos: a fase administrativa-policial militar, conduzida pela autoridade de PJM (art. 7º, CPPM), e a fase judicial, conduzida pelos membros da Justiça Militar e pelo Ministério Público. Exige, portanto, atos conjuntos do Poder Executivo (APJM/Comando), do Judiciário e do MP.\nÓrgãos envolvidos na conclusão: Comando da OME (fase administrativa), Auditoria Militar e Ministério Público (fase judicial)."],
["Explique o duplo prazo prescricional do crime de deserção.","6 a 15 linhas","A deserção tem regime prescricional especial, exigindo a concorrência de dois prazos para a extinção da punibilidade. Prescrição temporal (art. 125, CPM): regulada pelo máximo da pena privativa de liberdade; sendo o máximo de 2 anos, prescreve em 4 anos (art. 125, VI). Prescrição por idade (art. 132, CPM): embora decorrido o prazo temporal, só extingue a punibilidade quando o desertor atinge 45 anos (praça) ou 60 anos (oficial). Os dois critérios devem ocorrer simultaneamente; não basta o decurso do prazo temporal se o desertor ainda não atingiu a idade."],
["Descreva o rito procedimental da fase administrativa da IPD (6 etapas) e a regra de contagem do prazo.","10 a 20 linhas","Etapas: (1) Parte de Falta, lavrada imediatamente após a ausência injustificada, de onde surge a IPD e marco inicial da contagem; (2) Parte de Ausência, 24h após o início da contagem, que aciona o Comandante para determinar o inventário; (3) Inventário, com duas testemunhas idôneas, obrigatório; (4) cópia dos assentamentos, solicitada à P/1; (5) Parte de Deserção, lavrada após consumado o prazo de 8 dias; (6) Termo de Deserção, ato mais importante, publicado em BI antes da remessa à Auditoria.\nContagem (art. 451, §1º, CPPM): inicia-se à 00h do dia seguinte à verificação da falta. Falta no dia 1: contagem às 00h do dia 2; o oitavo dia termina às 23h59 do dia 9; consumação às 00h do dia 10. Lavrar o termo antes disso é erro grave. As diligências de busca não são obrigatórias (Lei 8.236/1991)."]

["Discorra sobre o Termo de Deserção: requisitos formais, publicação e efeitos jurídicos.","10 a 20 linhas","O Termo de Deserção é o ato singular e formal mais relevante da IPD. Requisitos: lavrado imediatamente após a consumação da deserção (art. 451, caput, e art. 456, §3º, CPPM); pode ser impresso ou datilografado; assinado por quatro agentes: Comandante da Unidade (ou autoridade correspondente/superior), duas testemunhas idôneas (de preferência oficiais) e o militar incumbido da lavratura (escrevente).\nPublicação obrigatória em BI ou BG antes da remessa à Auditoria.\nEfeitos (art. 452): tem caráter de instrução provisória, fornecendo os elementos para a propositura da ação penal, e sujeita desde logo o desertor à prisão, equivalendo a mandado de prisão em aberto expedido pela autoridade de PJM."],

["Caso hipotético: o Cb PM Rita faltou ao serviço no dia 10/05/2026. O 1º Ten Caio, comandante da subunidade, expediu a Parte de Ausência 5 dias depois. O Comandante delegou a IPD a um 2º Sgt. O oficial dispensou o inventário por não haver carga, lavrou o Termo de Deserção no dia 18/05, assinou-o sozinho, publicou-o após enviar os autos e arquivou a IPD. Identifique, no mínimo, 5 erros técnicos.","10 a 20 linhas","(1) Delegação a sargento: a IPD só pode ser delegada a oficial da ativa (art. 7º, §1º, CPPM). (2) Parte de Ausência fora do prazo: deve ser expedida 24h após o início da contagem (art. 456). (3) Dispensa do inventário: ato obrigatório, com duas testemunhas idôneas, mesmo sem carga. (4) Prazo: falta verificada no dia 10, contagem às 00h do dia 11, oitavo dia termina 23h59 do dia 18, consumação às 00h do dia 19; lavrar o termo no dia 18 é erro grave (art. 451, §1º). (5) Assinatura isolada: o termo exige quatro assinaturas (Comandante, duas testemunhas e escrevente). (6) Publicação em BI deve preceder a remessa. (7) Arquivamento: encerrar sem remeter os autos à Auditoria é grave omissão (art. 454, §2º)."]

var estado={};
function el(h){var d=document.createElement("div");d.innerHTML=h;return d.firstElementChild}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function mkNav(){tabs.forEach(function(t,i){var b=document.createElement("button");b.textContent=t.label;if(t.id==="sim")b.className="sim";b.onclick=function(){show(t.id)};b.id="nb_"+t.id;nav.appendChild(b)})}
function show(id){tabs.forEach(function(t){var p=$("#p_"+t.id);if(p)p.classList.toggle("hide",t.id!==id);$("#nb_"+t.id).classList.toggle("on",t.id===id)});window.scrollTo(0,0)}

function vfItem(txt,num,key){
  var d=el('<div class="q"><span class="n">'+num+'.</span><span class="vf"><button data-v="1">V</button><button data-v="0">F</button></span><span>'+esc(txt)+'</span><div class="just"></div></div>');
  d.querySelectorAll("button").forEach(function(b){b.onclick=function(){d.querySelectorAll("button").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");estado[key]=b.dataset.v==="1"}});
  return d}
function mcItem(q,num,key){
  var d=el('<div class="q"><div><span class="n">'+num+'.</span>'+esc(q[0])+'</div><div class="ops"></div><div class="just"></div></div>');
  q[1].forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent="("+"ABCDE"[i]+") "+o;b.onclick=function(){d.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");estado[key]=i};d.querySelector(".ops").appendChild(b)});
  return d}
function dcItem(enun,meta,num,key){
  var d=el('<div class="q"><div><span class="n">'+num+'.</span>'+esc(enun)+'</div><div class="meta">'+esc(meta)+'</div><textarea></textarea><div class="espelho"></div></div>');
  return d}

function buildBloco(b,i){
  var p=el('<section id="p_b'+i+'" class="hide"><h2>'+esc(b.t)+'</h2><div class="meta">23 questões: 15 V/F · 5 múltipla escolha · 3 discursivas</div></section>');
  var k="b"+i;
  p.appendChild(el("<h3>Parte A — Verdadeiro ou Falso (15)</h3>"));
  b.vf.forEach(function(q,j){var d=vfItem(q[0],j+1,k+"v"+j);d.querySelector(".just").textContent="Justificativa: "+q[2];d.dataset.k=k+"v"+j;d.dataset.a=q[1];p.appendChild(d)});
  p.appendChild(el("<h3>Parte B — Múltipla escolha (5)</h3>"));
  b.mc.forEach(function(q,j){var d=mcItem(q,16+j,k+"m"+j);d.querySelector(".just").textContent="Gabarito: ("+"ABCDE"[q[2]]+"). "+q[3];d.dataset.k=k+"m"+j;d.dataset.a=q[2];p.appendChild(d)});
  p.appendChild(el("<h3>Parte C — Discursivas (3)</h3>"));
  b.dc.forEach(function(q,j){var d=dcItem(q[0],q[1],21+j,k+"d"+j);d.querySelector(".espelho").textContent="ESPELHO (modelo de resposta)\n\n"+q[2];p.appendChild(d)});
  var bt=el('<button class="btn">Verificar gabarito</button>'),rs=el('<button class="btn b2">Refazer</button>'),sc=el('<div class="score"></div>');
  bt.onclick=function(){
    var ac=0,tot=0;
    p.querySelectorAll(".q[data-k]").forEach(function(d){
      var key=d.dataset.k,mc=key.indexOf("m")>0&&key.charAt(key.length-2)==="m";
      var cor=mc?parseInt(d.dataset.a,10):(d.dataset.a==="true");
      tot++;var ok=(estado[key]===cor);if(ok)ac++;
      d.classList.remove("ok","err");d.classList.add(ok?"ok":"err");d.classList.add("show");
    });
    p.querySelectorAll(".q:not([data-k])").forEach(function(d){d.classList.add("show")});
    sc.style.display="block";sc.textContent="Objetivas: "+ac+" de "+tot+" corretas ("+Math.round(ac*100/tot)+"%). Compare as discursivas com os espelhos.";
    sc.scrollIntoView({behavior:"smooth",block:"center"})};
  rs.onclick=function(){location.reload()};
  p.appendChild(bt);p.appendChild(rs);p.appendChild(sc);
  main.appendChild(p)}

/* ---------- Simulado ---------- */
var timerId=null,restante=SIM.tempo*60,iniciado=false;
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x}
function buildSim(){
  var p=el('<section id="p_sim" class="hide"><h2>Simulado · Polícia Judiciária Militar</h2><div class="box"><b>Estrutura (igual à prova):</b> 3 quesitos V/F de 5 assertivas (0,20 cada = 3,0) · 4 múltiplas escolhas (0,5 cada = 2,0) · 2 discursivas de 1,5 · 1 discursiva de 2,0 · Total 10,0 · Tempo: 100 min.</div></section>');
  var ctl=el('<div><button class="btn" id="ini">Iniciar prova</button> <span class="timer" id="tm">100:00</span></div>');
  p.appendChild(ctl);
  var area=el('<div id="area"></div>');var n=0;
  SIM.Q.forEach(function(q,i){
    n++;var k="s"+i;
    if(q.tipo==="vf"){
      var w=el('<div class="box"><b>'+n+'º QUESITO</b> — '+esc(q.enun)+' <span class="meta">(Valor: 1,0 ponto; cada assertiva vale 0,20)</span></div>');
      q.itens.forEach(function(it,j){var d=vfItem(it[0],String.fromCharCode(97+j),k+"i"+j);d.querySelector(".just").textContent="Justificativa: "+it[2];d.dataset.k=k+"i"+j;d.dataset.a=it[1];d.dataset.w=0.2;w.appendChild(d)});
      area.appendChild(w)}
    else if(q.tipo==="mc"){
      var d=mcItem([n+"º QUESITO ("+q.val.toString().replace(".",",")+" pontos) — "+q.enun,q.op],"",k);d.querySelector(".just").textContent="Gabarito: ("+"ABCDE"[q.c]+"). "+q.j;d.dataset.k=k;d.dataset.a=q.c;d.dataset.w=q.val;d.dataset.mc="1";area.appendChild(d)}
    else{
      var d2=dcItem(n+"º QUESITO — "+q.enun,"Valor: "+q.val.toString().replace(".",",")+" pontos · Mínimo "+q.min+" e máximo "+q.max+" linhas","",k);
      d2.querySelector(".espelho").textContent="ESPELHO\n\n"+q.esp;
      var au=el('<div class="meta" style="margin-top:8px">Autoavaliação: <select data-dk="'+i+'"><option value="0">0 (não atendeu)</option><option value="0.5">Metade</option><option value="1">Total</option></select></div>');
      d2.appendChild(au);area.appendChild(d2)}
  });
  var bt=el('<button class="btn">Verificar gabarito e calcular nota</button>'),sc=el('<div class="score"></div>');
  bt.onclick=function(){
    clearInterval(timerId);
    var obj=0,maxObj=0;
    area.querySelectorAll(".q[data-k]").forEach(function(d){
      var key=d.dataset.k,w=parseFloat(d.dataset.w),mc=d.dataset.mc==="1";
      var cor=mc?parseInt(d.dataset.a,10):(d.dataset.a==="true");
      maxObj+=w;var ok=(estado[key]===cor);if(ok)obj+=w;
      d.classList.remove("ok","err");d.classList.add(ok?"ok":"err");d.classList.add("show")});
    var dis=0,maxDis=0;
    area.querySelectorAll(".q:not([data-k])").forEach(function(d){
      d.classList.add("show");var s=d.querySelector("select");var i=parseInt(s.dataset.dk,10);
      var v=SIM.Q[i].val;maxDis+=v;dis+=v*parseFloat(s.value)});
    var tot=obj+dis;
    sc.style.display="block";
    sc.innerHTML="Objetivas: "+obj.toFixed(2).replace(".",",")+" / "+maxObj.toFixed(1).replace(".",",")+"<br>Discursivas (autoavaliação): "+dis.toFixed(2).replace(".",",")+" / "+maxDis.toFixed(1).replace(".",",")+"<br><span style='font-size:1.2rem;color:var(--bor)'>NOTA FINAL: "+tot.toFixed(2).replace(".",",")+" / 10,0</span><br><span class='meta'>Atualize as autoavaliações e clique de novo para recalcular.</span>";
    sc.scrollIntoView({behavior:"smooth",block:"center"})};
  p.appendChild(area);p.appendChild(bt);p.appendChild(sc);
  main.appendChild(p);
  setTimeout(function(){$("#ini").onclick=function(){
    if(iniciado)return;iniciado=true;this.disabled=true;
    timerId=setInterval(function(){restante--;$("#tm").textContent=fmt(Math.max(restante,0));
      if(restante<=0){clearInterval(timerId);alert("Tempo esgotado! Clique em “Verificar gabarito e calcular nota”.")}},1000)}},0)
}

mkNav();B.forEach(buildBloco);buildSim();show("b0");
</script>
</body>
</html>
