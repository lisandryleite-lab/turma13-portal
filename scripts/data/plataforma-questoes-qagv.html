["Diferencie minorias de grupos vulneráveis, indicando exemplos, a relação gênero e espécie e o objetivo de cada grupo.","6 a 15 linhas","Grupos vulneráveis são indivíduos com alta probabilidade de serem ofendidos ou atacados, mas que não possuem identidade ou traço comum entre si (ex.: consumidores, sindicatos, idosos, crianças, mulheres, pessoas com deficiência, LGBTQIAPN+). São o gênero, a minoria lato sensu; buscam o respeito e o exercício de garantias já reconhecidas.\nMinorias são sujeitos conectados por um traço cultural comum, que os difere dos demais; esse traço não visa a ser eliminado, mas reconhecido e respeitado, com fundamento na pluralidade (ex.: indígenas). São a espécie, a minoria stricto sensu; buscam primeiro o reconhecimento de direitos e, depois, o seu exercício. O número, por si só, não caracteriza minoria, e a proteção institucional exige que seja não dominante no Estado (Siqueira e Castro, 2017)."],
["Indique os quatro elementos (peculiaridades) das minorias e explique a importância da diferenciação para a política pública.","6 a 15 linhas","Elementos: (a) posição de não dominação junto ao grupo social; (b) vínculo subjetivo de solidariedade entre os membros para proteção da identidade cultural, característica que não pertence aos grupos vulneráveis; (c) demandam especial proteção estatal; (d) sofrem opressão social.\nImportância: ao tratar de minoria, a política pública deve contemplar o reconhecimento de direitos e a manutenção do traço cultural específico (fator de discriminação), sem eliminá-lo para homogeneizar a sociedade (BRITO, 2009). Para grupos vulneráveis, a estratégia é distinta, pois não envolve preservar traço cultural, e sim pôr em prática direitos já reconhecidos."],
["Explique a correlação entre minorias e grupos vulneráveis e os Direitos Humanos, nos quatro aspectos da apostila.","10 a 20 linhas","(A) Fundamentação legal: DUDH, que estabelece princípios de igualdade e não discriminação; convenções e tratados, como a CERD e a Convenção sobre os Direitos das Pessoas com Deficiência (CDPD).\n(B) Princípio da igualdade e não discriminação: proibição da discriminação em todas as formas e igualdade de direitos e oportunidades, independentemente de raça, gênero, orientação sexual, religião, deficiência ou status socioeconômico.\n(C) Ações afirmativas: medidas especiais para assegurar a igualdade de fato e corrigir desigualdades históricas e sociais; proteção contra abusos, exploração e violência.\n(D) Reconhecimento e valorização da diversidade: direito à autodeterminação e à participação ativa nos processos decisórios; valorização da diversidade cultural, social e étnica."]

["Discorra sobre o Estatuto do Idoso: conceito, prioridades (art. 3º, §2º e art. 71), gratuidade (art. 39), os crimes dos arts. 96 e 97 e a negativa de crédito por superendividamento.","10 a 20 linhas","Idoso é a pessoa com mais de 60 anos, conforme a apostila. Família, comunidade, sociedade e poder público devem assegurar, com absoluta prioridade, os direitos à vida, saúde, alimentação, educação, cultura, esporte, lazer, trabalho, cidadania, liberdade, dignidade, respeito e convivência familiar e comunitária. É dever de todos zelar pela dignidade do idoso (art. 10, §3º).\nPrioridade especial aos maiores de 80 (art. 3º, §2º); prioridade na tramitação processual a partir de 60 anos (art. 71). Gratuidade dos transportes coletivos públicos urbanos e semiurbanos aos maiores de 65 (art. 39), exceto serviços seletivos e especiais paralelos aos regulares.\nArt. 96: discriminar idoso, dificultando acesso a operações bancárias, transporte etc.: reclusão de 6 meses a 1 ano e multa. Art. 97: deixar de prestar assistência: detenção de 6 meses a 1 ano e multa, aumentada de metade se resulta lesão corporal grave e triplicada se resulta morte. A negativa de crédito motivada por superendividamento do idoso não constitui crime (novidade de 2021)."]

dc:[
["Explique as hipóteses do art. 5º e as cinco formas de violência do art. 7º da Lei Maria da Penha.","10 a 20 linhas","Art. 5º: configura violência doméstica e familiar contra a mulher qualquer ação ou omissão baseada no gênero que cause morte, lesão, sofrimento físico, sexual ou psicológico e dano moral ou patrimonial: I) no âmbito da unidade doméstica (espaço de convívio permanente, com ou sem vínculo familiar, inclusive esporadicamente agregadas); II) no âmbito da família (comunidade de indivíduos aparentados por laços naturais, afinidade ou vontade expressa); III) em qualquer relação íntima de afeto, na qual o agressor conviva ou tenha convivido com a ofendida, independentemente de coabitação. As relações independem de orientação sexual.\nArt. 7º: violência física (ofensa à integridade ou saúde corporal); psicológica (dano emocional, diminuição da autoestima, controle de ações, ameaça, humilhação, manipulação, isolamento, perseguição contumaz etc.); sexual (constranger a presenciar, manter ou participar de relação sexual não desejada; impedir uso de contraceptivo; forçar casamento, gravidez, aborto ou prostituição); patrimonial (retenção, subtração, destruição de bens, documentos, recursos); moral (calúnia, difamação ou injúria)."],
["Descreva as três fases do ciclo de violência e o rol de medidas protetivas (arts. 22, 23 e 24), destacando seu caráter não exaustivo.","6 a 15 linhas","Fase 1, tensão: o agressor fica tenso e irritado por coisas insignificantes, com acessos de raiva, humilhações, ameaças e destruição de objetos. Fase 2, explosão: a tensão acumulada se materializa em violência verbal, física, psicológica, moral ou patrimonial. Fase 3, arrependimento (lua de mel): o agressor se torna amável para conseguir a reconciliação, e a mulher, confusa e pressionada, abre mão de seus direitos enquanto ele diz que vai mudar.\nMedidas: protetivas de urgência que obrigam o agressor (art. 22); protetivas de urgência à ofendida (art. 23); proteção de ordem patrimonial (art. 24). O rol é não exaustivo: o juiz pode conceder outras medidas se verificada situação que torne a mulher ainda mais vulnerável."],
["Descreva a sequência de ações do efetivo na Situação 03 do POP (violência doméstica à luz da Lei Maria da Penha) e as condutas a evitar.","10 a 20 linhas","Sequência: certificar-se da violência ouvindo primeiro a mulher; obter confirmação e local do agressor, procurando conduzi-lo com as partes à Delegacia da Mulher, Delegacia Comum ou de Plantão; perguntar se a mulher autoriza a entrada na residência, de preferência com testemunhas da vizinhança; conduzir primeiro a vítima ferida ao atendimento médico e depois à delegacia, sem que vítima e agressor sigam no mesmo espaço físico; havendo lesões aparentes e testemunhas, encaminhar todas as partes à delegacia mesmo contra a vontade da ofendida; se a mulher negar e não houver lesões, registrar BO, colher assinatura de mulher e agressor e informar o COPOM/CIODS; se desistir de denunciar após confirmadas as agressões, prosseguir até a delegacia para decisão da autoridade judiciária; reportar ao Coordenador do COPOM/CIODS ou ao Oficial de Operações se houver dificuldade para o registro.\nA evitar: declarações que desencorajem o relato, ameaçar com prisão para desencorajar novos pedidos, comentários depreciativos, tratar o caso como de menor importância e julgamentos pessoais."]
]});

dc:[
["Discorra sobre o Estatuto da Pessoa com Deficiência: conceito (art. 2º), art. 11 e os crimes dos arts. 88 a 91 com suas penas.","10 a 20 linhas","Conceito (art. 2º): pessoa com impedimento de longo prazo de natureza física, mental, intelectual ou sensorial que, em interação com uma ou mais barreiras, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais.\nArt. 11: não poderá ser obrigada a se submeter a intervenção clínica ou cirúrgica, a tratamento ou a institucionalização forçada.\nCrimes: art. 88, discriminar, induzir ou incitar discriminação: reclusão de 1 a 3 anos e multa; art. 89, apropriar-se de ou desviar bens, proventos, pensão, benefícios, remuneração ou rendimento: reclusão de 1 a 4 anos e multa; art. 90, abandonar em hospitais, casas de saúde, entidades de abrigamento ou congêneres: reclusão de 6 meses a 3 anos e multa; art. 91, reter ou utilizar cartão magnético, meio eletrônico ou documento destinados ao recebimento de benefícios ou a operações financeiras, para obter vantagem indevida: detenção de 6 meses a 2 anos e multa."],
["Explique o TEA: símbolos, o que é o autismo, manifestações e alguns direitos da legislação estadual 15.487/2015.","6 a 15 linhas","Símbolos: Dia Mundial de Conscientização do Autismo (ONU, dezembro de 2007); o azul representa a maior incidência no sexo masculino (4 meninos para 1 menina); a fita é estampada com peças de quebra-cabeça em várias cores vibrantes, simbolizando complexidade, esperança e diversidade.\nO autismo é um grupo de transtornos do desenvolvimento do cérebro (TEA), com prejuízos em comunicação social e em comportamentos repetitivos e restritos; cerca de 1% das crianças recebem o diagnóstico, com manifestações geralmente antes dos três anos.\nDireitos (Lei 15.487/2015): informações para diagnóstico e tratamento precoce; tratamento individualizado conforme a gravidade; atendimento em unidade clínica especializada, distinta das de doenças mentais e dependência química; acesso gratuito a medicamentos e nutrientes sem interrupção; professores capacitados; servidores federais com dependentes com TEA têm horário especial com compensação."],
["Diferencie imigrante, refugiado e foragido; explique a afirmação “não existe imigrante ilegal” e conceitue população em situação de rua, desabrigado e sem-teto.","10 a 20 linhas","Imigrante escolheu se deslocar e pode voltar a qualquer momento ao país de origem; para viver regularmente no Brasil precisa de autorização de residência (art. 30 da Lei 13.445/2017). Refugiado foi forçado a se deslocar, conta com proteção internacional e princípio da não devolução, pois voltar significa risco à vida. Refugiado não é foragido nem fugitivo, que geralmente fogem da justiça por crime.\nNão existe imigrante ilegal: ele pode estar em situação irregular, infração administrativa que pode ser resolvida; isso não o torna criminoso. Todos os imigrantes têm os mesmos direitos à educação, saúde e trabalho.\nPopulação em situação de rua (Decreto 7.053/2009, art. 1º, p. único): grupo heterogêneo com pobreza extrema, vínculos familiares interrompidos ou fragilizados e inexistência de moradia convencional regular, que utiliza logradouros públicos e áreas degradadas como espaço de moradia e sustento, e unidades de acolhimento. Desabrigado (ONU): vive nas ruas por tragédias naturais, guerras, desemprego em massa etc. Sem-teto (ONU): pessoa ou família sem abrigo que sobrevive à vida nas ruas e carrega suas posses."]
]});

dc:[
["Descreva a atuação da PMPE na abordagem à população LGBTQIAPN+ (lésbicas, gays, bissexuais, travestis e mulheres trans, homens trans e intersexuais), o uso do nome social e a Nota Técnica 001/2024.","10 a 20 linhas","LGB: abordagem convencional (homens por PM masculinos, mulheres por PM femininas); exceção se a troca de carícias constituir ato obsceno de cunho sexual, vale também para casal hetero.\nTravestis e mulheres trans: efetivo feminino; exceções: ausência de PM feminina (solicitar uma mulher para acompanhar visualmente a revista ou mandar o abordado pressionar a própria roupa), disparidade de porte físico (PM masculino), constrangimento da policial.\nHomem trans: recomenda-se o efetivo feminino; se não for possível identificá-lo, primeiro o efetivo masculino, salvo se o homem trans se identificar e solicitar PM feminina; na ausência de efetivo feminino, observar o item 4.2.6 do POP 001/SDS.\nIntersexual: conforme a identidade assumida; discrição, respeito à intimidade e atenção à segurança.\nNome social: evitar repetir em voz alta o nome de registro; chamar pelo nome social; documentos oficiais devem conter o nome social e também o nome de registro. Nota Técnica 001/2024 (MPPE): recomenda o direito de pessoas trans usarem banheiros públicos conforme sua identidade de gênero."],
["Compare o procedimento do POP para criança acusada de ato infracional e adolescente acusado, quanto a condução, algemas, feridos, ciência ao COPOM, sigilo e competência.","10 a 20 linhas","Criança: se identificada documentalmente, conduzida ao Conselho Tutelar da área; sem documento, conduzida à residência para que um responsável acompanhe e comprove a condição. Adolescente: sem documentos, conduzido à residência para comprovar a condição.\nAlgemas: o adolescente não deve ser algemado, exceto em circunstâncias de extrema necessidade, com fundamentação por escrito das motivações (Súmula Vinculante 11).\nCondução: banco traseiro da viatura, separado de adultos, ainda que tenham cometido o ilícito conjuntamente. Feridos: primeiro atendimento médico, solicitando a Ficha de esclarecimento médico, pois o Conselho Tutelar só recebe mediante ela.\nTodo deslocamento necessário dá ciência ao COPOM/DIM. Sigilo da imagem e da identidade (art. 17, ECA); jamais divulgar fotos em redes sociais.\nCompetência: plantão da DEPAI (atual DPCCAI) quando adolescente é infrator ou há coautoria com adultos; nos CVLI, concorrente com o DHPP. Criança ou adolescente vítima: DECCA, e encaminhamentos assistenciais ao Conselho Tutelar do local de moradia da vítima."],
["Descreva a sequência de ações no policiamento em território indígena e nos eventos de ensaios e sambadas de maracatus rurais ou baque solto.","10 a 20 linhas","Território indígena: o Comandante determina à Seção de Operações levantamento prévio da área (residências, moradores, mapa, aceitação do policiamento). Havendo recusa, avalia a necessidade e oficia aos escalões superiores, ao Judiciário, ao MP e à FUNAI. Confecciona Cartão Programa ou Ordem de Serviço, fiscalizados pelo Oficial de Operações. No local, dar ciência ao cacique ou pajé (ou liderança local); não apreender utensílios de lavoura, caça e pesca, salvo se usados em crime; não permitir acesso a locais sagrados; evitar busca em objetos sagrados. Em mandados de prisão e busca: solicitar ao NIS equipe de inteligência, Ordem de Serviço, presença do Promotor, oficial comandando a operação, leitura do mandado independente de autorização do morador, e Auto Circunstanciado.\nMaracatus: o Comandante da OME recepciona a documentação, com antecedência mínima de 3 dias úteis, reúne-se com os organizadores e determina Ordem de Serviço; o P/3 faz vistoria prévia; a Seção de Instrução elabora Nota de Instrução. O efetivo apresenta-se aos organizadores, mantém a ordem sem restringir coercitivamente o término, sabe que os eventos costumam iniciar às 22h, ocorrem 2 a 3 vezes ao ano e podem terminar após o amanhecer, e registra horários no relatório."]

["A ASCRIAD realiza:",["operações de fiscalização de casas de shows e bares, com a Vara da Infância e da Juventude, para proteger menores.","policiamento com música.","fiscalização de medidas protetivas de urgência.","palestras sobre racismo.","policiamento comunitário no modelo Koban."],0,"Assessoria da Criança e do Adolescente."],

["Sobre racismo institucional, é CORRETO:",["É a prática de uma organização de não prover serviço a determinada pessoa devido à sua cor, cultura ou origem étnica.","Só pode ser praticado por pessoa física.","Pode levar à condenação criminal da empresa pela Lei 7.716/89.","Não pode ser manifestado por normas ou práticas do trabalho.","Não gera indenização cível."],0,"Não há como criminalizar a instituição, mas cabe indenização cível."],

dc:[
["Explique a importância da integração com outras secretarias e descreva o portfólio da Secretaria da Mulher de Pernambuco.","10 a 20 linhas","A eficiência no controle e combate às dificuldades de minorias e grupos vulneráveis depende da integração entre os órgãos de controle interno e externo; um só setor não é suficiente, e a integração fortalece as instituições do Estado Democrático de Direito.\nSecretaria da Mulher: criada como Secretaria Especial da Mulher (Lei 13.205/2007), tornou-se Secretaria de Estado (Lei 14.264/2011) e é regida pela Lei 15.452/2015. Serviços: proteção e abrigamento (plantão 24h, quatro casas-abrigo sigilosas, pioneiro no abrigamento de mulheres e dependentes); monitoramento eletrônico (Portaria Conjunta SecMulher/SDS 50/2015, medida cautelar por decisão judicial); 190 Mulher (Portaria Conjunta 53/2015, atendimento prioritário, cadastro por e-mail); Patrulha Maria da Penha (fiscaliza MPU, com ações preventivas); Ouvidoria da Mulher (0800.281.8187, 24h)."],
["Enumere e explique as cinco técnicas de comunicação eficaz e empática.","6 a 15 linhas","1) Escuta ativa: ouvir com atenção e passar mais tempo escutando do que falando, para entender o problema. 2) Empatia: capacidade de se colocar no lugar do outro, identificando seus sentimentos e entendendo o problema sob a perspectiva dele. 3) Não se prender a um script: um roteiro de apoio é útil, mas o script engessado não favorece o atendimento humanizado. 4) Personalizar a abordagem: levantar informações específicas, ouvir os detalhes da fala da vítima e fazer perguntas baseadas no relato. 5) Ter proatividade: antecipar-se às solicitações e cobranças da sociedade e oferecer soluções que vão além do problema apresentado."],
["Diferencie preconceito, discriminação e racismo institucional e indique as práticas para aproximar a polícia da mídia.","10 a 20 linhas","Preconceito: atitude ou sentimento negativo em relação a um grupo, geralmente sem conhecimento real e baseado em estereótipos e generalizações. Discriminação: ação ou prática de tratar alguém de forma injusta devido à sua pertença a um grupo; é a manifestação prática do preconceito. Racismo institucional: prática de uma organização que deixa de prover serviço a determinada pessoa por cor, cultura ou origem étnica, também por normas e práticas discriminatórias do cotidiano. Pela Lei 7.716/89 o agente criminoso só pode ser pessoa, então não se criminaliza a empresa, mas cabe indenização cível.\nMídia: criar programa permanente de comunicação social, com técnicos especializados; priorizar a mídia regional e local (jornais de bairro, rádios locais, TVs regionais); desenvolver campanhas educativas de prevenção usando sempre a marca “Polícia”, e não batalhão ou distrito; elaborar propagandas de utilidade pública permanentes."]
]});

{tipo:"mc",val:0.5,enun:"Assinale a alternativa INCORRETA sobre o Transtorno do Espectro Autista (TEA).",op:["O Dia Mundial de Conscientização foi estipulado pela ONU em dezembro de 2007.","A fita é estampada com peças de quebra-cabeça em várias cores.","A incidência é maior entre crianças do sexo feminino.","As primeiras manifestações ocorrem geralmente antes dos três anos.","Os prejuízos ocorrem em comunicação social e comportamentos repetitivos e restritos."],c:2,j:"A incidência é maior entre meninos (4 para 1)."},
{tipo:"mc",val:0.5,enun:"Sobre imigrantes e refugiados, é CORRETO afirmar:",op:["Não existe imigrante ilegal: ele pode estar em situação irregular, infração administrativa que pode ser resolvida.","O refugiado é foragido da justiça.","O imigrante conta com o princípio da não devolução.","O refugiado escolheu se deslocar.","Só os refugiados têm direito à saúde e à educação no Brasil."],c:0,j:"Todos os imigrantes têm os mesmos direitos, refugiados ou não."},
{tipo:"mc",val:0.5,enun:"O serviço 190 Mulher foi estabelecido pela:",op:["Portaria Conjunta SEC. MULHER/SDS nº 53, de 05 de novembro de 2015.","Portaria Conjunta SecMulher/SDS nº 50, de 06 de outubro de 2015.","Lei Estadual 15.186/2013.","Lei 18.139/2023.","Lei 13.205/2007."],c:0,j:"A Portaria nº 50 estabeleceu o monitoramento eletrônico."},
{tipo:"mc",val:0.5,enun:"Sobre a relação da Polícia com a mídia, é prática recomendada:",op:["Priorizar o contato com a mídia regional e local.","Evitar o contato com a imprensa.","Realizar campanhas com a marca de cada batalhão.","Divulgar propagandas apenas esporadicamente.","Excluir técnicos especializados do programa de comunicação."],c:0,j:"A apostila recomenda priorizar jornais de bairro, rádios locais e TVs regionais."},
{tipo:"dc",val:1.5,min:6,max:15,enun:"Diferencie preconceito, discriminação e racismo institucional e explique por que o racismo institucional não pode ser criminalizado pela Lei 7.716/89.",esp:"Preconceito: atitude ou sentimento negativo em relação a um grupo, em geral sem conhecimento real e baseado em estereótipos. Discriminação: ação ou prática de tratar alguém de forma injusta ou prejudicial por pertencer a um grupo; é a manifestação prática do preconceito. Racismo institucional: prática de organização (empresa, grupo, associação ou instituição pública) de não prover serviço a determinada pessoa por cor, cultura ou origem étnica, inclusive por normas, práticas e comportamentos discriminatórios do cotidiano.\nPela Lei 7.716/89, o agente criminoso só pode ser pessoa, não instituição; portanto não há como criminalizar a empresa, mas há como obter indenização cível, pois o racismo institucional é fenômeno sociológico que gera esse tipo de indenização."},
{tipo:"dc",val:1.5,min:10,max:20,enun:"Uma guarnição atende ocorrência de violência doméstica. A mulher nega as agressões, mas apresenta lesões aparentes e há testemunhas; o agressor não está no local. Discorra, com base no POP da PMPE, sobre: a ordem de oitiva e a entrevista; o atendimento médico e a condução; a condução da vítima e do agressor; o encaminhamento diante da negativa da vítima e a conduta se o agressor estiver ausente.",esp:"Oitiva e entrevista: ouvir primeiro a mulher em situação de violência, entrevistada preferencialmente por policial feminina, sem contato físico ou visual com testemunhas ou autor, acolhendo e respeitando, sem ofendê-la ou criticá-la.\nAtendimento médico: se ferida, conduzir primeiro ao atendimento médico e depois à delegacia.\nNegativa: havendo lesões aparentes e testemunhas, mesmo que a mulher negue, todas as partes devem ser encaminhadas à delegacia mais próxima, após o apoio ao atendimento médico, mesmo contra a vontade da ofendida; só se não houver lesões registra-se BO, com assinatura de mulher e agressor, informando o COPOM/CIODS.\nCondução: vítima e agressor em locais distintos; havendo só uma viatura, o agressor no xadrez e a mulher no banco de trás; nunca no mesmo espaço físico.\nAgressor ausente: realizar diligências para encontrá-lo e, mesmo sem encontrá-lo, conduzir os demais envolvidos (vítima, testemunhas) à Delegacia da Mulher; se houver dificuldade para o registro, reportar ao Coordenador do COPOM/CIODS ou ao Oficial de Operações."},
{tipo:"dc",val:2.0,min:10,max:20,enun:"Analise o caso e identifique, no mínimo, 5 erros técnicos, fundamentando com o ECA e os POPs da PMPE. Uma guarnição abordou um adolescente suspeito de ato infracional, ferido e sem documentos. O comandante o algemou sem justificar, colocou-o no compartimento junto a presos adultos, conduziu-o diretamente à delegacia sem atendimento médico, não comunicou o COPOM sobre os deslocamentos e um dos policiais divulgou sua foto em rede social.",esp:"1) Algemas: o adolescente não deve ser algemado, exceto em extrema necessidade, com fundamentação por escrito (Súmula Vinculante 11).\n2) Condução: deve ser colocado no banco traseiro da viatura, separado dos adultos, ainda que tenham cometido o ilícito em conjunto.\n3) Ferimentos: havendo ferido, primeiro deve haver atendimento médico, solicitando a Ficha de esclarecimento médico.\n4) Ciência ao COPOM: todo deslocamento necessário deve dar ciência ao COPOM.\n5) Sigilo: o sigilo da imagem e da identidade deve ser respeitado; nunca divulgar fotos de crianças ou adolescentes em redes sociais (art. 17, ECA).\n6) Sem documentos: deveria ser conduzido à residência para que a identificação documental comprove sua condição de adolescente ou criança (se criança, ao Conselho Tutelar).\n7) Competência: o encaminhamento é ao plantão da DEPAI (atual DPCCAI), pois o adolescente está na condição de infrator."}
]};

var SIM2={tempo:100,Q:[
{tipo:"vf",val:1.0,enun:"Sobre a fundamentação legal de Direitos Humanos aplicável aos grupos vulneráveis e minorias, marque (V) verdadeiro ou (F) falso para as assertivas abaixo.",itens:[
["Proibição da Discriminação: A legislação de direitos humanos não possui como objeto proibir a discriminação em todas as suas formas e garantir que minorias e grupos vulneráveis não sejam marginalizados;",false,"Falso. A apostila diz que a legislação de direitos humanos VISA proibir a discriminação em todas as suas formas."],
["Medidas Especiais: Para assegurar a igualdade de fato, ... como ações afirmativas, para corrigir desigualdades históricas...;",true,"Correto. Podem ser necessárias medidas especiais, como ações afirmativas, para corrigir desigualdades históricas e sociais."],
["Os direitos humanos são fundamentais para a proteção e promoção da dignidade e dos direitos de todas as pessoas, não incluindo, contudo, minorias e grupos vulneráveis;",false,"Falso. Os direitos humanos protegem todas as pessoas, INCLUINDO minorias e grupos vulneráveis."],
["Declaração Universal dos Direitos Humanos (DUDH), Convenção sobre a Eliminação de Todas as Formas de Discriminação Racial (CERD), Convenção sobre os Direitos das Pessoas com Deficiência (CDPD), são institutos que oferecem uma base legal específica para a proteção dos grupos vulneráveis e minorias;",true,"Correto. A apostila cita esses instrumentos como base legal específica para a proteção desses grupos."],
["Reconhecimento e valorização da diversidade, é promovida através Autodeterminação e Participação Diversidade Cultural e Social, com a inclusão de diferentes identidades e culturas, nos processos decisórios que afetam suas vidas.",true,"Correto. Item D da apostila: Autodeterminação e Participação; Diversidade Cultural e Social."]]},
{tipo:"vf",val:1.0,enun:"Sobre o conceito de minorias marque (V) verdadeiro ou (F) falso para as assertivas abaixo.",itens:[
["São sujeitos sem conexão comum ou traço cultural;",false,"Falso. Minorias são sujeitos CONECTADOS, com um traço cultural comum."],
["O traço cultural em comum não difere as minorias dos demais integrantes da sociedade;",false,"Falso. É justamente esse traço cultural que difere o grupo dos demais integrantes da sociedade."],
["O número, por si só é capaz de caracterizar uma minoria;",false,"Falso. O número, por si só, NÃO é capaz de caracterizar uma minoria."],
["O traço que os difere, não visa a ser eliminado, visa justamente, ao contrário, ser reconhecido e respeitado, com fundamento na pluralidade;",true,"Correto (Siqueira e Castro, 2017)."],
["Para que a minoria seja protegida institucionalmente, necessita sofrerem opressão social.",true,"Gabarito oficial: V. Atenção: a apostila diz que, para ser protegida institucionalmente, a minoria “necessita ser não dominante no Estado em que vive”; “sofrem opressão social” aparece como uma das quatro peculiaridades das minorias. A banca considerou a assertiva verdadeira."]]},
{tipo:"vf",val:1.0,enun:"Sobre as diferenças entre grupos vulneráveis e minorias marque (V) verdadeiro ou (F) falso para as assertivas abaixo.",itens:[
["Os grupos vulneráveis são categorizados como um grupo mais amplo (gênero), podendo ser descrito como “minoria stricto sensu”;",false,"Falso. Grupos vulneráveis = gênero = “minoria LATO sensu”. Stricto sensu são as minorias (espécie)."],
["Nos grupos vulneráveis se cultua o seu fator de discrímen, o que se busca é o reconhecimento de seus direitos;",false,"Falso. Nos grupos vulneráveis NÃO se cultua o fator de discrímen; busca-se o RESPEITO e o EXERCÍCIO de suas garantias."],
["As minorias são tidas como espécie ou “minoria stricto sensu”; definindo-se como um conjunto específico de indivíduos ligados pelo traço comum que os coloca em situação de isolamento social;",true,"Correto (item 2.2 da apostila)."],
["Os grupos vulneráveis preocupam-se com o reconhecimento de seus direitos, isto é, procuram colocar em prática direitos já reconhecidos e aceitos;",false,"Falso. Os grupos vulneráveis procuram apenas EXERCER seus direitos (colocar em prática direitos já reconhecidos). Quem busca o reconhecimento de direitos são as minorias."],
["A implementar uma política pública voltada para um grupo vulnerável, a estratégia e mecanismos utilizados devem ser traçados de forma distinta, já quando se tratar de políticas públicas voltadas para minorias deve-se tomar o cuidado de manter o traço cultural específico, fator de discriminação.",true,"Correto (Brito, 2009): para minorias, manter o traço cultural específico (igualdade na diferença)."]]},
{tipo:"mc",val:0.5,enun:"Sobre o previsto nas legislações especiais que protegem os grupos vulneráveis e minorias marque a alternativa que corresponde a resposta CORRETA.",op:["Nos casos expressos na Lei 8.069/90, Estatuto da Criança e do Adolescente, não se aplica excepcionalmente este Estatuto às pessoas entre dezoito e vinte e um anos de idade.","As relações pessoais enunciadas na Lei 11.340/06, conhecida como a Lei Maria da Penha independem de orientação sexual.","Entre as pessoas idosas, é assegurada prioridade especial aos maiores de 75 (setenta e cinco) anos, atendendo-se suas necessidades sempre preferencialmente em relação às demais pessoas idosas.","Aos maiores de 60 (sessenta) anos fica assegurada a gratuidade dos transportes coletivos públicos urbanos e semiurbanos.","O Estatuto da Criança e Adolescente, em vários artigos estabelece a proteção integral à criança e parcial ao adolescente, bem como o direito a não discriminação."],c:1,j:"Art. 5º, parágrafo único, da Lei 11.340/06. (A) o ECA APLICA-SE excepcionalmente às pessoas entre 18 e 21 anos; (C) prioridade especial aos maiores de 80 anos; (D) gratuidade aos maiores de 65 anos (art. 39); (E) proteção integral à criança E ao adolescente."},
{tipo:"mc",val:0.5,enun:"De acordo com o previsto nos POPs que regem as abordagens aos grupos vulneráveis e minorias marque a alternativa que corresponde a resposta INCORRETA.",op:["É recomendado que o efetivo policial feminino realize a busca pessoal na mulher transexual e na travesti, devido a sua aparência feminina.","Habitar uma rua, uma praça ou demais espaços públicos não constitui, por si só, crime de “mendicância”.","Ao profissional de segurança pública é facultado o direito de perguntar a forma como a pessoa abordada gostaria de ser chamada: nome social.","O policial deve ser discreto na revista de pertences, respeitar a intimidade da pessoa abordada, bem como não esquecer da segurança do seu efetivo.","O cidadão em situação de vivência de rua é sujeito de direitos e deveres, assim como qualquer outro brasileiro, de acordo com a Constituição Federal /1988."],c:2,j:"A apostila diz que o profissional de segurança pública DEVE perguntar a forma como a pessoa abordada gostaria de ser chamada (nome social); não é faculdade. A alternativa (A) está correta conforme o POP 0005."},
{tipo:"mc",val:0.5,enun:"De acordo com o previsto nos POPs que regem as abordagens aos grupos vulneráveis e minorias marque a alternativa que corresponde a resposta CORRETA.",op:["A equipe policial deverá amparar a mulher vítima de violência, demonstrando interesse na ocorrência, porém desincentivando a mulher em situação de violência a fazer o registro do fato.","A depender da situação e equipe policial poderá conduzir a mulher detida juntamente com indivíduos do sexo masculino.","O efetivo não deve permitir que o Deficiente Mental explique seu comportamento, não gerando assim, uma confiança entre ele e o policiamento.","Não deverá apreender utensílios como foice, facão, machados, facas, arco, flecha e similares utilizados para lavoura, caça e pesca, exceto, quando esses tenham sido utilizados na prática de crime.","Comandante da Guarnição permitirá o acesso de seus componentes a locais considerados sagrados pelos povos indígenas."],c:3,j:"POP 0023 (território indígena), transcrito literalmente. (A) deve INCENTIVAR o registro; (B) deve conduzir a mulher detida SEPARADA dos homens; (C) deve PERMITIR que o Deficiente Mental explique seu comportamento; (E) NÃO permitirá o acesso a locais sagrados."},
{tipo:"mc",val:0.5,enun:"De acordo com os conceitos e definições aplicados a comunidade LGBTQIAPN+, marque a alternativa que corresponde a resposta INCORRETA.",op:["Sexo Biológico - Macho ou fêmea, masculino ou feminino, a depender dos órgãos genitais, do sistema reprodutor que nascem com a pessoa e dos hormônios por ela desenvolvidos.","Cisgênero: é a pessoa que se identifica com o sexo biológico designado no momento de seu nascimento.","São os papéis sociais que cada um assume na sociedade. Refere-se a sentimentos, posturas subjetivas - Identidade de Gênero.","Orientação, Condição ou Prática Sexual: Refere-se à direção do desejo afetivo e sexual. O termo orientação sexual substituiu a noção de opção sexual.","Homem Transexual: Pessoa que teve o sexo designado como masculino ao nascer, mas que vive como e busca reconhecimento social no gênero feminino."],c:4,j:"Homem transexual é quem teve o sexo designado como FEMININO ao nascer e vive no gênero MASCULINO. A definição da alternativa é a de Mulher Transexual. A alternativa (C) está correta: identidade de gênero são os papéis sociais, sentimentos e posturas subjetivas."},
{tipo:"dc",val:1.5,min:5,max:10,enun:"A relação entre a Mídia e a Polícia tem se tornado o grande desafio a ser vencido. Ao longo do tempo foram desenvolvidas formas de aproximar e aprimorar esse relacionamento. Assim sendo apresente as práticas que podem ser aplicadas para quebrar esse paradigma.",esp:"Contexto: há relação antiga e intrínseca entre mídia e sistema penal. A imprensa costuma destacar escândalos, o que cria nos policiais a ideia de que ela é inimiga da polícia, sem entender que a mídia vive dos espaços que ocupa na audiência (SENASP, 2007).\nPráticas para aproximar e aprimorar o relacionamento:\n1) Criar um programa permanente de comunicação social para divulgar as atividades da polícia, com técnicos especializados (relações públicas, jornalistas, marketeiros).\n2) Priorizar o contato com a mídia regional e local (jornais de bairro, rádios locais, TVs regionais), já que a grande mídia oferece resistência.\n3) Desenvolver campanhas educativas de prevenção contra a violência, usando sempre a mesma marca “Polícia”, e não o batalhão ou distrito.\n4) Elaborar propagandas de utilidade pública de forma permanente, para orientar as comunidades.\n\nComentário da correção (nota 1,2/1,5): faltou citar “elaborar propagandas de utilidade pública permanentes”."},
{tipo:"dc",val:1.5,min:5,max:10,enun:"O atendimento humanizado, com respeito as diferenças, estreita a relação entre a Polícia Militar e a sociedade, elevando os padrões de legalidade, técnica e qualidade do serviço prestado pela Polícia Militar. Buscando uma atuação mais empática e respeitosa foram desenvolvidas técnicas de comunicação e aproximação da sociedade. Deste modo, discorra sobre a abordagem policial apresentando as técnicas de comunicação eficaz e empática.",esp:"O atendimento humanizado se apoia em cinco técnicas de comunicação eficaz e empática:\n1) Escuta ativa: ouvir com atenção o que o cidadão tem a dizer, passando mais tempo escutando do que falando, para entender o problema.\n2) Empatia: colocar-se no lugar do outro, identificando seus sentimentos e entendendo o problema sob a perspectiva dele.\n3) Não se prender a um script: um roteiro de apoio é útil, mas o script engessado não favorece o atendimento humanizado.\n4) Personalizar a abordagem: levantar informações específicas, ouvir os detalhes do relato e fazer perguntas baseadas nele.\n5) Ter proatividade: antecipar-se às demandas da sociedade e oferecer soluções que vão além do problema apresentado.\nNa abordagem, aplicar os POPs (ex.: POP 0005, LGBTQIAPN+: perguntar e usar o nome social, respeitar a individualidade).\n\nComentário da correção (nota 1,0/1,5): faltaram “não se prenda a um script”, “personalize sua abordagem” e “tenha proatividade”."},
{tipo:"dc",val:2.0,min:5,max:10,enun:"Os conceitos de racismo institucional e estrutural, preconceito e discriminação, sempre estiveram ligados a Polícia Militar, portanto é fundamental para a instituição enfrentá-los combatendo as desigualdades e promovendo Direitos Humanos. Disserte sobre tais conceitos e apresente os avanços em DDHH desenvolvidos pela PMPE.",esp:"Preconceito: atitude ou sentimento negativo em relação a um grupo (raça, gênero, religião, orientação sexual etc.), formado em geral sem conhecimento real, com base em estereótipos e generalizações.\nDiscriminação: ação ou prática de tratar alguém de forma injusta ou prejudicial por pertencer a um grupo; é a manifestação prática do preconceito.\nRacismo institucional: prática de uma organização (empresa, grupo, associação ou instituição pública) de não prover serviço a alguém por cor, cultura ou origem étnica, também por normas, práticas e comportamentos discriminatórios do cotidiano. Pela Lei 7.716/89 o agente criminoso só pode ser pessoa: não há denúncia criminal contra a instituição, mas cabe indenização cível.\nAvanços da PMPE: a DASDH (Diretoria de Articulação Social e Direitos Humanos), criada pela Lei Estadual 15.186/2013 e subordinada à DPO, promove a aproximação comunitária e os direitos humanos por meio dos programas Polícia Comunitária (Sistema Koban), Patrulha Maria da Penha, Patrulha Escolar, PROERD, ASCRIAD, Programa de Enfrentamento à Intolerância e Companhia Independente de Música (CIMus). Também participa de conselhos e câmaras técnicas (violência contra a mulher, igualdade racial, pessoa com deficiência, criança e adolescente) e conta com os POPs padronizados de atendimento aos grupos vulneráveis.\n\nComentário da correção (nota 1,7/2,0): faltou apresentar os programas da DASDH/PMPE."}
]};

/* ===================== MOTOR ===================== */
var $=function(s){return document.querySelector(s)};
var nav=$("#nav"),main=$("#main");
var tabs=B.map(function(b,i){return {id:"b"+i,label:b.t.split(" · ")[0]+" · "+b.t.split(" · ")[1]}});
tabs.push({id:"sim",label:"SIMULADO"});
tabs.push({id:"ae26",label:"PROVA AE 2026"});
var estado={};
function el(h){var d=document.createElement("div");d.innerHTML=h;return d.firstElementChild}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function mkNav(){tabs.forEach(function(t,i){var b=document.createElement("button");b.textContent=t.label;if(t.id==="sim"||t.id==="ae26")b.className="sim";b.onclick=function(){show(t.id)};b.id="nb_"+t.id;nav.appendChild(b)})}
function show(id){tabs.forEach(function(t){var p=$("#p_"+t.id);if(p)p.classList.toggle("hide",t.id!==id);$("#nb_"+t.id).classList.toggle("on",t.id===id)});window.scrollTo(0,0)}

function vfItem(txt,num,key){
  var d=el('<div class="q"><span class="n">'+num+'.</span><span class="vf"><button data-v="1">V</button><button data-v="0">F</button></span><span>'+esc(txt)+'</span><div class="just"></div></div>');
  d.querySelectorAll("button").forEach(function(b){b.onclick=function(){d.querySelectorAll("button").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");estado[key]=b.dataset.v==="1"}});
  return d}
function mcItem(q,num,key){
  var d=el('<div class="q"><div><span class="n">'+num+'.</span>'+esc(q[0])+'</div><div class="ops"></div><div class="just"></div></div>');
  q[1].forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent="("+"ABCDE"[i]+") "+o;b.onclick=function(){d.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");estado[key]=i};d.querySelector(".ops").appendChild(b)});
  return d}
function dcItem(enun,meta,num,key){
  var d=el('<div class="q"><div><span class="n">'+num+'.</span>'+esc(enun)+'</div><div class="meta">'+esc(meta)+'</div><textarea></textarea><div class="espelho"></div></div>');
  return d}

function buildBloco(b,i){
  var p=el('<section id="p_b'+i+'" class="hide"><h2>'+esc(b.t)+'</h2><div class="meta">23 questões: 15 V/F · 5 múltipla escolha · 3 discursivas</div></section>');
  var k="b"+i;
  p.appendChild(el("<h3>Parte A — Verdadeiro ou Falso (15)</h3>"));
  b.vf.forEach(function(q,j){var d=vfItem(q[0],j+1,k+"v"+j);d.querySelector(".just").textContent="Justificativa: "+q[2];d.dataset.k=k+"v"+j;d.dataset.a=q[1];p.appendChild(d)});
  p.appendChild(el("<h3>Parte B — Múltipla escolha (5)</h3>"));
  b.mc.forEach(function(q,j){var d=mcItem(q,16+j,k+"m"+j);d.querySelector(".just").textContent="Gabarito: ("+"ABCDE"[q[2]]+"). "+q[3];d.dataset.k=k+"m"+j;d.dataset.a=q[2];p.appendChild(d)});
  p.appendChild(el("<h3>Parte C — Discursivas (3)</h3>"));
  b.dc.forEach(function(q,j){var d=dcItem(q[0],q[1],21+j,k+"d"+j);d.querySelector(".espelho").textContent="ESPELHO (modelo de resposta)\n\n"+q[2];p.appendChild(d)});
  var bt=el('<button class="btn">Verificar gabarito</button>'),rs=el('<button class="btn b2">Refazer</button>'),sc=el('<div class="score"></div>');
  bt.onclick=function(){
    var ac=0,tot=0;
    p.querySelectorAll(".q[data-k]").forEach(function(d){
      var key=d.dataset.k,mc=key.indexOf("m")>0&&key.charAt(key.length-2)==="m";
      var cor=mc?parseInt(d.dataset.a,10):(d.dataset.a==="true");
      tot++;var ok=(estado[key]===cor);if(ok)ac++;
      d.classList.remove("ok","err");d.classList.add(ok?"ok":"err");d.classList.add("show");
    });
    p.querySelectorAll(".q:not([data-k])").forEach(function(d){d.classList.add("show")});
    sc.style.display="block";sc.textContent="Objetivas: "+ac+" de "+tot+" corretas ("+Math.round(ac*100/tot)+"%). Compare as discursivas com os espelhos.";
    sc.scrollIntoView({behavior:"smooth",block:"center"})};
  rs.onclick=function(){location.reload()};
  p.appendChild(bt);p.appendChild(rs);p.appendChild(sc);
  main.appendChild(p)}

/* ---------- Simulado ---------- */
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x}
function buildSim(S,id,titulo,desc){
  var timerId=null,restante=S.tempo*60,iniciado=false;
  var p=el('<section id="p_'+id+'" class="hide"><h2>'+esc(titulo)+'</h2><div class="box">'+desc+'</div></section>');
  var ctl=el('<div><button class="btn">Iniciar prova</button> <span class="timer">'+fmt(S.tempo*60)+'</span></div>');
  var ini=ctl.querySelector("button"),tm=ctl.querySelector(".timer");
  p.appendChild(ctl);
  var area=el('<div></div>');var n=0;
  S.Q.forEach(function(q,i){
    n++;var k=id+"_"+i;
    if(q.tipo==="vf"){
      var w=el('<div class="box"><b>'+n+'º QUESITO</b> — '+esc(q.enun)+' <span class="meta">(Valor: 1,0 ponto; cada assertiva vale 0,20)</span></div>');
      q.itens.forEach(function(it,j){var d=vfItem(it[0],String.fromCharCode(97+j),k+"i"+j);d.querySelector(".just").textContent="Justificativa: "+it[2];d.dataset.k=k+"i"+j;d.dataset.a=it[1];d.dataset.w=0.2;w.appendChild(d)});
      area.appendChild(w)}
    else if(q.tipo==="mc"){
      var d=mcItem([n+"º QUESITO ("+q.val.toString().replace(".",",")+" pontos) — "+q.enun,q.op],"",k);d.querySelector(".just").textContent="Gabarito: ("+"ABCDE"[q.c]+"). "+q.j;d.dataset.k=k;d.dataset.a=q.c;d.dataset.w=q.val;d.dataset.mc="1";area.appendChild(d)}
    else{
      var d2=dcItem(n+"º QUESITO — "+q.enun,"Valor: "+q.val.toString().replace(".",",")+" pontos · Mínimo "+q.min+" e máximo "+q.max+" linhas","",k);
      d2.querySelector(".espelho").textContent="ESPELHO\n\n"+q.esp;
      var au=el('<div class="meta" style="margin-top:8px">Autoavaliação: <select data-dk="'+i+'"><option value="0">0 (não atendeu)</option><option value="0.5">Metade</option><option value="1">Total</option></select></div>');
      d2.appendChild(au);area.appendChild(d2)}
  });
  var bt=el('<button class="btn">Verificar gabarito e calcular nota</button>'),sc=el('<div class="score"></div>');
  bt.onclick=function(){
    clearInterval(timerId);
    var obj=0,maxObj=0;
    area.querySelectorAll(".q[data-k]").forEach(function(d){
      var key=d.dataset.k,w=parseFloat(d.dataset.w),mc=d.dataset.mc==="1";
      var cor=mc?parseInt(d.dataset.a,10):(d.dataset.a==="true");
      maxObj+=w;var ok=(estado[key]===cor);if(ok)obj+=w;
      d.classList.remove("ok","err");d.classList.add(ok?"ok":"err");d.classList.add("show")});
    var dis=0,maxDis=0;
    area.querySelectorAll(".q:not([data-k])").forEach(function(d){
      d.classList.add("show");var s=d.querySelector("select");var i=parseInt(s.dataset.dk,10);
      var v=S.Q[i].val;maxDis+=v;dis+=v*parseFloat(s.value)});
    var tot=obj+dis;
    sc.style.display="block";
    sc.innerHTML="Objetivas: "+obj.toFixed(2).replace(".",",")+" / "+maxObj.toFixed(1).replace(".",",")+"<br>Discursivas (autoavaliação): "+dis.toFixed(2).replace(".",",")+" / "+maxDis.toFixed(1).replace(".",",")+"<br><span style='font-size:1.2rem;color:var(--bor)'>NOTA FINAL: "+tot.toFixed(2).replace(".",",")+" / 10,0</span><br><span class='meta'>Atualize as autoavaliações e clique de novo para recalcular.</span>";
    sc.scrollIntoView({behavior:"smooth",block:"center"})};
  ini.onclick=function(){
    if(iniciado)return;iniciado=true;ini.disabled=true;
    timerId=setInterval(function(){restante--;tm.textContent=fmt(Math.max(restante,0));
      if(restante<=0){clearInterval(timerId);alert("Tempo esgotado! Clique em “Verificar gabarito e calcular nota”.")}},1000)};
  p.appendChild(area);p.appendChild(bt);p.appendChild(sc);
  main.appendChild(p);
}

mkNav();B.forEach(buildBloco);
buildSim(SIM,"sim","Simulado · QAGV","<b>Estrutura (igual à prova):</b> 3 quesitos V/F de 5 assertivas (0,20 cada = 3,0) · 4 múltiplas escolhas (0,5 cada = 2,0) · 2 discursivas de 1,5 · 1 discursiva de 2,0 · Total 10,0 · Tempo: 100 min.");
buildSim(SIM2,"ae26","Prova AE de QAGV · CFO 2026 (T19)","<b>Prova real aplicada em 15/09/2026</b>, com o gabarito oficial da folha de respostas. 3 quesitos V/F (3,0) · 4 múltiplas escolhas (2,0) · discursivas de 1,5, 1,5 e 2,0 · Total 10,0 · Tempo: 100 min. Os espelhos das discursivas trazem a resposta pela apostila e os comentários da correção.");
show("b0");

</script>
